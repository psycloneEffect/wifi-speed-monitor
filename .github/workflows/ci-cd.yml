name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # 手動実行を許可

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ==========================================
  # Job 1: コード品質チェック（リント）
  # ==========================================
  lint:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: 🔍 Run flake8
        run: |
          flake8 project/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 project/ tests/ --count --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true
      
      - name: 🔍 Run pylint
        run: |
          pylint project/ --rcfile=pyproject.toml --fail-under=8.0
        continue-on-error: true
      
      - name: 🎨 Check code formatting with black
        run: |
          black --check project/ tests/
        continue-on-error: true
      
      - name: 📏 Check import sorting with isort
        run: |
          isort --check-only project/ tests/
        continue-on-error: true

  # ==========================================
  # Job 2: 型チェック（mypy）
  # ==========================================
  type-check:
    name: 🔬 Type Checking
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: 🔬 Run mypy
        run: |
          mypy project/ --config-file=pyproject.toml
        continue-on-error: true

  # ==========================================
  # Job 3: テスト実行（マルチOS、複数Python版）
  # ==========================================
  test:
    name: 🧪 Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: 🧪 Run tests with pytest
        run: |
          pytest tests/ -v --cov=project --cov-report=xml --cov-report=html --cov-report=term
      
      - name: 📊 Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: 📈 Upload coverage HTML report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  # ==========================================
  # Job 4: セキュリティスキャン
  # ==========================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install bandit safety
      
      - name: 🔒 Run Bandit (security linter)
        run: |
          bandit -r project/ -f json -o bandit-report.json
        continue-on-error: true
      
      - name: 🔐 Check for known vulnerabilities with Safety
        run: |
          safety check --json
        continue-on-error: true
      
      - name: 📤 Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # ==========================================
  # Job 5: ドキュメント生成
  # ==========================================
  docs:
    name: 📚 Build Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      
      - name: 📚 Build MkDocs documentation
        run: |
          mkdocs build --strict
      
      - name: 📤 Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site/
          retention-days: 30

  # ==========================================
  # Job 6: パッケージビルド
  # ==========================================
  build:
    name: 📦 Build Package
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: 🏗️ Build package
        run: |
          python -m build
      
      - name: 🔍 Check package with twine
        run: |
          twine check dist/*
      
      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-package
          path: dist/
          retention-days: 30

  # ==========================================
  # Job 7: 統合レポート生成
  # ==========================================
  report:
    name: 📊 Generate Summary Report
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, security, docs, build]
    if: always()
    
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: 📊 Create summary
        run: |
          echo "## 🎉 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All jobs completed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Artifacts Generated:" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation" >> $GITHUB_STEP_SUMMARY
          echo "- Distribution Package" >> $GITHUB_STEP_SUMMARY
