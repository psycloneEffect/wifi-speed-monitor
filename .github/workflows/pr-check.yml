name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ==========================================
  # クイックチェック（PR用の高速バリデーション）
  # ==========================================
  quick-check:
    name: ⚡ Quick Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 差分比較用に履歴を取得
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: 🧪 Run tests
        run: |
          pytest tests/ -v --cov=project --cov-report=term
      
      - name: 📊 Check coverage threshold
        run: |
          coverage report --fail-under=80
      
      - name: 🔍 Lint changed files
        run: |
          # 変更されたPythonファイルのみをチェック
          git diff --name-only --diff-filter=ACM ${{ github.event.pull_request.base.sha }} | grep '\.py$' | xargs -r flake8
        continue-on-error: true

  # ==========================================
  # PR情報コメント
  # ==========================================
  pr-comment:
    name: 💬 Post PR Comment
    runs-on: ubuntu-latest
    needs: quick-check
    if: always()
    permissions:
      pull-requests: write
    
    steps:
      - name: 📝 Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.quick-check.result }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const message = status === 'success' 
              ? 'All checks passed! Ready for review.' 
              : 'Some checks failed. Please review the workflow results.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${emoji} **Quick Check Result**: ${message}\n\n[View Details](${context.payload.pull_request.html_url}/checks)`
            });
