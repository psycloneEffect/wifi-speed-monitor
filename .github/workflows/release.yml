name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # v1.0.0 形式のタグでトリガー
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ==========================================
  # リリースパッケージのビルドと公開
  # ==========================================
  release:
    name: 🚀 Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # リリース作成に必要
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 全履歴を取得（バージョン情報用）
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel
          pip install -e ".[dev]"
      
      - name: 🧪 Run full test suite
        run: |
          pytest tests/ -v --cov=project --cov-report=xml
      
      - name: 🏗️ Build distribution packages
        run: |
          python -m build
      
      - name: 🔍 Verify package
        run: |
          twine check dist/*
      
      - name: 📋 Extract release notes
        id: release_notes
        run: |
          # CHANGELOGから該当バージョンのリリースノートを抽出
          VERSION="${{ github.ref_name }}"
          if [ -f CHANGELOG.md ]; then
            sed -n "/## \[${VERSION#v}\]/,/## \[/p" CHANGELOG.md | sed '$ d' > release_notes.txt
          else
            echo "Release ${VERSION}" > release_notes.txt
          fi
      
      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release_notes.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📦 Publish to PyPI (Optional)
        if: false  # PyPI公開する場合は true に変更
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*

  # ==========================================
  # Windows 実行ファイルのビルド
  # ==========================================
  build-windows-exe:
    name: 🪟 Build Windows Executable
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      
      - name: 🏗️ Build executable with PyInstaller
        run: |
          pyinstaller --name="SpeedFinder" --onefile --windowed --icon=resources/icons/excellent.png project/main.py
      
      - name: 📤 Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/SpeedFinder.exe
          retention-days: 90
      
      - name: 📎 Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SpeedFinder.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # リリース通知
  # ==========================================
  notify:
    name: 📢 Notify Release
    runs-on: ubuntu-latest
    needs: [release, build-windows-exe]
    if: success()
    
    steps:
      - name: 📢 Create release announcement
        run: |
          echo "🎉 New release published: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- Python Package (PyPI)" >> $GITHUB_STEP_SUMMARY
          echo "- Windows Executable" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }})" >> $GITHUB_STEP_SUMMARY
