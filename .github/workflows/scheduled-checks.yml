name: Scheduled Checks

on:
  schedule:
    # 毎日午前3時（UTC）に実行
    - cron: '0 3 * * *'
  workflow_dispatch: # 手動実行も可能

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ==========================================
  # 依存関係の脆弱性チェック
  # ==========================================
  dependency-check:
    name: 🔐 Dependency Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install safety pip-audit
      
      - name: 🔒 Run Safety check
        run: |
          safety check --json --output safety-report.json
        continue-on-error: true
      
      - name: 🔍 Run pip-audit
        run: |
          pip-audit --format json --output pip-audit-report.json
        continue-on-error: true
      
      - name: 📤 Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            safety-report.json
            pip-audit-report.json
          retention-days: 30
      
      - name: 📢 Create issue if vulnerabilities found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔒 Security vulnerabilities detected in dependencies',
              body: '自動セキュリティチェックで脆弱性が検出されました。\n\n[ワークフロー実行を確認](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})',
              labels: ['security', 'dependencies']
            });

  # ==========================================
  # 古い依存関係の更新チェック
  # ==========================================
  outdated-dependencies:
    name: 📦 Check Outdated Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: 🔍 Check for outdated packages
        run: |
          pip list --outdated --format=json > outdated-packages.json
          cat outdated-packages.json
      
      - name: 📤 Upload outdated packages report
        uses: actions/upload-artifact@v4
        with:
          name: outdated-packages
          path: outdated-packages.json
          retention-days: 7

  # ==========================================
  # コードカバレッジトレンド
  # ==========================================
  coverage-trend:
    name: 📊 Coverage Trend Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: 🧪 Run tests with coverage
        run: |
          pytest tests/ -v --cov=project --cov-report=json
      
      - name: 📊 Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered'])")
          echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT
          echo "Current coverage: ${COVERAGE}%"
      
      - name: 📈 Comment coverage trend
        run: |
          echo "## 📊 Current Test Coverage: ${{ steps.coverage.outputs.coverage }}%" >> $GITHUB_STEP_SUMMARY
          if [ $(echo "${{ steps.coverage.outputs.coverage }} < 80" | bc) -eq 1 ]; then
            echo "⚠️ Warning: Coverage is below 80%" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Coverage meets the 80% threshold" >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================
  # リンク切れチェック（ドキュメント）
  # ==========================================
  link-check:
    name: 🔗 Check Documentation Links
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
      
      - name: 🔗 Check links in markdown files
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check-config.json'
        continue-on-error: true

  # ==========================================
  # サマリーレポート
  # ==========================================
  summary:
    name: 📋 Daily Health Summary
    runs-on: ubuntu-latest
    needs: [dependency-check, outdated-dependencies, coverage-trend, link-check]
    if: always()
    
    steps:
      - name: 📊 Generate daily summary
        run: |
          echo "# 🏥 Daily Health Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date +'%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results:" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Security: ${{ needs.dependency-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Outdated Packages: ${{ needs.outdated-dependencies.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage Trend: ${{ needs.coverage-trend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Link Check: ${{ needs.link-check.result }}" >> $GITHUB_STEP_SUMMARY
