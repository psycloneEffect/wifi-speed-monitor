version: 2
updates:
  # Python依存関係の自動更新
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    reviewers:
      - "onoma"  # GitHubユーザー名に変更してください
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    
  # GitHub Actions の自動更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    reviewers:
      - "onoma"  # GitHubユーザー名に変更してください
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
