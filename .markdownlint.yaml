# Markdownlint configuration
# https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

# Default state for all rules
default: true

# Path-based overrides
MD004:
  # Unordered list style
  style: "dash"  # Use - for lists

MD007:
  # Unordered list indentation
  indent: 2

MD013:
  # Line length
  line_length: 120
  code_blocks: false
  tables: false
  headings: true

MD022:
  # Headings should be surrounded by blank lines
  # Disabled for CHANGELOG.md style
  false

MD024:
  # Multiple headings with the same content
  siblings_only: true  # Allow same heading in different sections

MD025:
  # Multiple top-level headings
  front_matter_title: ""

MD032:
  # Lists should be surrounded by blank lines
  # Disabled for compact CHANGELOG style
  false

MD033:
  # Inline HTML
  allowed_elements:
    - br
    - details
    - summary
    - img
    - a
    - sup
    - sub

MD041:
  # First line in file should be a top level heading
  # Disabled for LICENSE files
  false

MD046:
  # Code block style
  style: "fenced"

MD049:
  # Emphasis style
  style: "asterisk"

MD050:
  # Strong style
  style: "asterisk"
